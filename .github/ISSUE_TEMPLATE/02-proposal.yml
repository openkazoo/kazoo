name: Proposal
description: Changes that affect system architecture or core behavior and require discussion
title: "component: short proposal summary"
labels: ["Proposal"]

body:
  - type: markdown
    attributes:
      value: |
        Use the format: component: short proposal summary (e.g., `applications/crossbar: allow login with email and password only`)

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem you are trying to solve and alternative approaches you have considered.
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: What is your proposed design?
      description: Describe the approach, including behavior changes and any API or system-wide configuration updates.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: What is the compatibility and migration impact?
      description: Describe backward compatibility, upgrade concerns, and any required migration steps.
    validations:
      required: true
