; Kazoo runtime config for the local ARM-Mac dev node.
;
; Selected with KAZOO_CONFIG at launch. All three paths must be ABSOLUTE: the
; start script cd's to the release root before exec'ing erlexec, so a relative
; path resolves against _build/dev/rel/kazoo and not the repo:
;
;   KAZOO_CONFIG=$PWD/config/config-dev.ini \
;   VMARGS_PATH=$PWD/config/vm.args.dev \
;   RELX_CONFIG_PATH=$PWD/config/sys-dev.config \
;     _build/dev/rel/kazoo/bin/kazoo foreground
;
; In VSCode tasks and launch.json (#34) that means ${workspaceFolder}/...
;
; Hosts, ports and credentials match docker-compose.dev.yml. Keep the two in
; step -- the compose file is the source of truth for the infra side.

[amqp]
uri = "amqp://guest:guest@127.0.0.1:5672"

; kazoo_apps_init:set_cookie/0 runs at boot and RESETS the live node cookie to
; the value below (unless KAZOO_COOKIE is set in the environment). vm.args only
; supplies the *initial* cookie, so `-setcookie' in config/vm.args.dev must
; match this exactly -- otherwise `bin/kazoo remote_console' and the els_dap
; debugger attach fine before boot and are locked out after it.
[kazoo_apps]
cookie = kazoo_dev_cookie

; Single dev node runs ecallmgr in-process alongside the other whapps, so it
; shares the one cookie.
[ecallmgr]
cookie = kazoo_dev_cookie

; Levels are applied by kazoo_apps_init:set_loglevel/0 against the lager
; handlers declared in config/sys-dev.config. A level naming a handler that
; isn't declared there is silently ignored (kz_log matches on bad_module), so
; there is no syslog entry here -- a dev box shouldn't be writing to syslog.
[log]
console = info
error = error

[data]
config = couchdb3

[couchdb3]
ip = "127.0.0.1"
port = 5984
username = admin
password = admin
